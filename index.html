<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Notepad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#f4f5f7;--surface:#fff;--sidebar-bg:#f9fafb;--topbar:#1e1e1e;
      --text:#1a1a1a;--text-muted:#6b7280;--text-light:#9ca3af;
      --accent:#3b82f6;--accent-hover:#2563eb;--border:#e5e7eb;--border-light:#f0f1f3;
      --hover:#f3f4f6;--active:#e8edf4;--danger:#ef4444;--sidebar-w:300px;
    }
    html,body{height:100%;font-family:'IBM Plex Sans',-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}

    /* Top Bar */
    .topbar{height:48px;background:var(--topbar);display:flex;align-items:center;padding:0 16px;gap:14px}
    .hamburger{background:none;border:none;color:#fff;cursor:pointer;padding:4px;display:flex;align-items:center;border-radius:4px}
    .hamburger:hover{background:rgba(255,255,255,.1)}
    .topbar-title{font-weight:600;color:#fff;text-transform:uppercase;font-size:13px;letter-spacing:1.2px}

    /* Layout */
    .layout{display:flex;height:calc(100vh - 48px)}

    /* Sidebar */
    .sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:margin-left .25s ease}
    .sidebar.collapsed{margin-left:calc(-1 * var(--sidebar-w))}
    .sidebar-top{padding:16px}
    .create-btn{width:100%;padding:10px 16px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
    .create-btn:hover{background:var(--accent-hover)}
    .search-box{padding:0 16px 12px}
    .search-wrapper{position:relative}
    .search-box input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;outline:none;background:var(--surface);color:var(--text);transition:border-color .15s}
    .search-box input:focus{border-color:var(--accent)}
    .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-light)}
    .sidebar-toolbar{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 8px;border-bottom:1px solid var(--border-light)}
    .sort-icon{color:var(--text-light);width:18px;height:18px}
    .more-btn{background:none;border:none;color:var(--text-light);cursor:pointer;padding:4px;border-radius:4px;display:flex;align-items:center}
    .more-btn:hover{background:var(--hover)}
    .notes-list{flex:1;overflow-y:auto}
    .notes-list::-webkit-scrollbar{width:4px}
    .notes-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
    .note-item{padding:14px 16px;cursor:pointer;border-left:3px solid transparent;transition:background .1s;position:relative}
    .note-item:hover{background:var(--hover)}
    .note-item.active{background:var(--active);border-left-color:var(--accent)}
    .note-item-title{font-size:14px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:28px}
    .note-item-preview{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .note-item-date{font-size:11px;color:var(--text-light);margin-top:4px}
    .delete-note-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:4px;border:none;background:transparent;color:var(--text-light);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:all .1s}
    .note-item:hover .delete-note-btn{opacity:1}
    .delete-note-btn:hover{background:#fee2e2;color:var(--danger)}

    /* Editor */
    .editor-area{flex:1;display:flex;flex-direction:column;min-width:0}

    /* Toolbar menus */
    .editor-toolbar{display:flex;align-items:center;gap:0;padding:0;background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:60}
    .menu-item{position:relative}
    .menu-trigger{font-size:13.5px;color:var(--text);padding:8px 14px;cursor:pointer;border:none;background:none;font-family:inherit;font-weight:500;transition:background .1s;display:block}
    .menu-trigger:hover,.menu-trigger.open{background:var(--hover)}
    .menu-dropdown{position:absolute;top:100%;left:0;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.12);min-width:200px;padding:4px 0;display:none;z-index:70}
    .menu-dropdown.open{display:block}
    .menu-dropdown .menu-entry{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;font-size:13.5px;color:var(--text);transition:background .08s;white-space:nowrap}
    .menu-dropdown .menu-entry:hover{background:var(--hover)}
    .menu-dropdown .menu-entry svg{width:16px;height:16px;flex-shrink:0;color:var(--text-muted)}
    .menu-dropdown .menu-entry .shortcut{margin-left:auto;font-size:11px;color:var(--text-light);font-family:'IBM Plex Sans',sans-serif}
    .menu-sep{height:1px;background:var(--border-light);margin:4px 0}
    .menu-entry .check-mark{width:16px;display:inline-flex;align-items:center;justify-content:center}

    /* Color buttons in toolbar */
    .toolbar-right{margin-left:auto;display:flex;align-items:center;gap:2px;padding-right:8px}
    .tb-btn{width:32px;height:32px;border:none;background:none;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background .1s;position:relative}
    .tb-btn:hover{background:var(--hover)}
    .tb-btn svg{width:16px;height:16px}
    .color-picker-wrapper{position:relative}
    .color-dropdown{position:absolute;top:36px;right:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:70;display:none}
    .color-dropdown.open{display:block}
    .color-dropdown label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px}
    .color-grid{display:grid;grid-template-columns:repeat(6,28px);gap:4px}
    .color-dot{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .1s}
    .color-dot:hover{transform:scale(1.15)}
    .color-dot.active{border-color:var(--accent)}
    .color-dot-inner{width:100%;height:100%;border-radius:50%;border:1px solid rgba(0,0,0,.1)}

    /* Editor body */
    .editor-title{border:none;outline:none;font-family:'IBM Plex Sans',sans-serif;font-size:24px;font-weight:600;padding:24px 32px 8px;background:transparent;width:100%}
    .editor-title::placeholder{color:var(--text-light)}
    .editor-title-hr{margin:0 32px;border:none;border-top:1px solid var(--border-light)}
    .editor-content{flex:1;border:none;outline:none;font-family:'IBM Plex Sans',sans-serif;font-size:15px;line-height:1.7;padding:16px 32px 32px;background:transparent;resize:none;width:100%}
    .editor-content::placeholder{color:var(--text-light)}
    .editor-content.no-wrap{white-space:nowrap;overflow-x:auto}
    .editor-wrapper{flex:1;background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
    .status-bar{height:28px;background:var(--sidebar-bg);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;padding:0 16px;font-size:11px;color:var(--text-light);gap:16px}
    .empty-editor{flex:1;display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--text-light);font-size:14px}

    /* Font picker */
    .font-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
    .font-dialog{background:var(--surface);border-radius:10px;padding:24px;max-width:340px;width:100%;box-shadow:0 16px 48px rgba(0,0,0,.15)}
    .font-dialog h4{font-size:16px;margin-bottom:14px}
    .font-option{padding:10px 14px;cursor:pointer;border-radius:6px;font-size:14px;transition:background .1s;margin-bottom:2px}
    .font-option:hover{background:var(--hover)}
    .font-option.active{background:var(--active);font-weight:600}
    .font-dialog .close-font{margin-top:12px;text-align:right}

    /* Find & Replace */
    .find-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:#fefce8;border-bottom:1px solid #fde68a}
    .find-bar input{padding:6px 10px;border:1px solid var(--border);border-radius:4px;font-family:inherit;font-size:13px;outline:none;width:180px}
    .find-bar input:focus{border-color:var(--accent)}
    .find-bar button{padding:5px 12px;border:1px solid var(--border);border-radius:4px;background:var(--surface);font-family:inherit;font-size:12px;cursor:pointer;font-weight:500}
    .find-bar button:hover{background:var(--hover)}
    .find-bar .find-close{border:none;background:none;cursor:pointer;color:var(--text-muted);font-size:18px;padding:4px 6px;border-radius:4px}
    .find-bar .find-close:hover{background:var(--hover)}

    /* Confirm */
    .confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
    .confirm-dialog{background:var(--surface);border-radius:10px;padding:24px 28px;max-width:360px;width:100%;box-shadow:0 16px 48px rgba(0,0,0,.15)}
    .confirm-dialog h4{font-size:16px;margin-bottom:6px}
    .confirm-dialog p{font-size:13px;color:var(--text-muted);margin-bottom:18px}
    .confirm-actions{display:flex;gap:8px;justify-content:flex-end}
    .btn{padding:8px 18px;border-radius:6px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
    .btn-cancel{background:var(--hover);color:var(--text)}
    .btn-cancel:hover{background:var(--border)}
    .btn-danger{background:var(--danger);color:#fff}
    .btn-danger:hover{background:#dc2626}

    @media(max-width:700px){
      :root{--sidebar-w:260px}
      .sidebar{position:fixed;top:48px;left:0;bottom:0;z-index:50;box-shadow:4px 0 20px rgba(0,0,0,.1)}
      .sidebar.collapsed{margin-left:calc(-1 * var(--sidebar-w));box-shadow:none}
      .mobile-overlay{position:fixed;inset:0;top:48px;background:rgba(0,0,0,.3);z-index:40}
      .editor-title{padding:20px 16px 8px;font-size:20px}
      .editor-title-hr{margin:0 16px}
      .editor-content{padding:12px 16px 24px;font-size:14px}
    }
  </style>
</head>
<body>
<div id="app"></div>
<script>
// ─── State ───
let notes = JSON.parse(localStorage.getItem('notepad_notes') || '[]');
let activeNoteId = notes.length > 0 ? notes[0].id : null;
let searchQuery = '';
let sidebarOpen = true;
let deleteTarget = null;
let openDropdown = null;   // 'textColor' | 'bgColor'
let openMenu = null;       // 'file' | 'edit' | 'format' | ...
let wordWrap = true;
let showFindBar = false;
let showFontPicker = false;
let editorFont = 'IBM Plex Sans';

const FONTS = ['IBM Plex Sans','Georgia','Courier New','Verdana','Times New Roman','Trebuchet MS'];
const COLORS = ['#1a1a1a','#374151','#6b7280','#dc2626','#ea580c','#d97706','#16a34a','#0891b2','#2563eb','#7c3aed','#db2777','#ffffff'];
const BG_COLORS = ['#ffffff','#fef3c7','#d1fae5','#dbeafe','#fce7f3','#ede9fe','#ffedd5','#ccfbf1','#f3f4f6','#fef9c3','#e0e7ff','#1e1e1e'];

function save() { localStorage.setItem('notepad_notes', JSON.stringify(notes)); }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function getActive() { return notes.find(n => n.id === activeNoteId) || null; }
function fmtDate(ts) {
  const d=new Date(ts),now=new Date(),diff=now-d;
  if(diff<60000)return'just now';if(diff<3600000)return Math.floor(diff/60000)+'m ago';
  if(diff<86400000)return Math.floor(diff/3600000)+'h ago';
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function wordCount(t){const s=t.trim();return s?s.split(/\s+/).length:0}

// ─── Undo/Redo ───
let undoStack = [], redoStack = [];
function pushUndo() {
  const note = getActive(); if (!note) return;
  const t=document.getElementById('editor-title'),c=document.getElementById('editor-content');
  undoStack.push({ title: t?.value||'', content: c?.value||'' });
  if (undoStack.length > 50) undoStack.shift();
  redoStack = [];
}

// ─── Render ───
function render() {
  const filtered = notes.filter(n =>
    n.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
    n.content.toLowerCase().includes(searchQuery.toLowerCase())
  );
  const active = getActive();
  const isMobile = window.innerWidth <= 700;

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <button class="hamburger" onclick="toggleSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="topbar-title">Online Notepad</span>
    </div>
    <div class="layout">
      ${isMobile && sidebarOpen ? '<div class="mobile-overlay" onclick="toggleSidebar()"></div>' : ''}
      <aside class="sidebar ${sidebarOpen?'':'collapsed'}">
        <div class="sidebar-top"><button class="create-btn" onclick="createNote()">+ Create new</button></div>
        <div class="search-box"><div class="search-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="search-input" placeholder="Search..." value="${esc(searchQuery)}" />
        </div></div>
        <div class="sidebar-toolbar">
          <svg class="sort-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h7M4 12h10M4 18h16"/></svg>
          <button class="more-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>
        </div>
        <div class="notes-list">
          ${filtered.length===0?`<div style="padding:32px 16px;text-align:center;color:var(--text-light);font-size:13px">${notes.length===0?'No notes yet':'No results'}</div>`:
          filtered.map(n=>`
            <div class="note-item ${n.id===activeNoteId?'active':''}" onclick="selectNote('${n.id}')">
              <div class="note-item-title">${esc(n.title||'Untitled Note')}</div>
              <div class="note-item-preview">${esc(n.content||'Blank')}</div>
              <div class="note-item-date">${fmtDate(n.updatedAt)}</div>
              <button class="delete-note-btn" onclick="event.stopPropagation();confirmDelete('${n.id}')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
              </button>
            </div>
          `).join('')}
        </div>
      </aside>
      <main class="editor-area">
        ${active ? renderEditor(active) : '<div class="empty-editor">Select a note or create a new one</div>'}
      </main>
    </div>
    ${deleteTarget!==null?renderConfirm():''}
    ${showFontPicker?renderFontPicker():''}
  `;
  bindEvents();
}

function renderEditor(active) {
  return `
    <div class="editor-toolbar">
      <!-- File -->
      <div class="menu-item">
        <button class="menu-trigger ${openMenu==='file'?'open':''}" onclick="event.stopPropagation();toggleMenu('file')">File</button>
        <div class="menu-dropdown ${openMenu==='file'?'open':''}">
          <div class="menu-entry" onclick="menuAction('new')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            New <span class="shortcut">Ctrl+N</span>
          </div>
          <div class="menu-entry" onclick="menuAction('open')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
            Open <span class="shortcut">Ctrl+O</span>
          </div>
          <div class="menu-sep"></div>
          <div class="menu-entry" onclick="menuAction('save')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Save <span class="shortcut">Ctrl+S</span>
          </div>
          <div class="menu-entry" onclick="menuAction('saveas')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M5 12l7 7 7-7"/><path d="M19 21H5"/></svg>
            Save As <span class="shortcut">Ctrl+Shift+S</span>
          </div>
          <div class="menu-sep"></div>
          <div class="menu-entry" onclick="menuAction('print')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            Print <span class="shortcut">Ctrl+P</span>
          </div>
        </div>
      </div>
      <!-- Edit -->
      <div class="menu-item">
        <button class="menu-trigger ${openMenu==='edit'?'open':''}" onclick="event.stopPropagation();toggleMenu('edit')">Edit</button>
        <div class="menu-dropdown ${openMenu==='edit'?'open':''}">
          <div class="menu-entry" onclick="menuAction('undo')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1014.85-3.36L3.51 4"/></svg>
            Undo <span class="shortcut">Ctrl+Z</span>
          </div>
          <div class="menu-entry" onclick="menuAction('redo')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-14.85-3.36L23 4"/></svg>
            Redo <span class="shortcut">Ctrl+Y</span>
          </div>
          <div class="menu-sep"></div>
          <div class="menu-entry" onclick="menuAction('cut')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
            Cut <span class="shortcut">Ctrl+X</span>
          </div>
          <div class="menu-entry" onclick="menuAction('copy')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
            Copy <span class="shortcut">Ctrl+C</span>
          </div>
          <div class="menu-entry" onclick="menuAction('delete')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            Delete
          </div>
          <div class="menu-sep"></div>
          <div class="menu-entry" onclick="menuAction('selectall')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M3 9h18"/></svg>
            Select All <span class="shortcut">Ctrl+A</span>
          </div>
          <div class="menu-sep"></div>
          <div class="menu-entry" onclick="menuAction('find')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            Find &amp; Replace <span class="shortcut">Ctrl+H</span>
          </div>
        </div>
      </div>
      <!-- Insert -->
      <div class="menu-item">
        <button class="menu-trigger ${openMenu==='insert'?'open':''}" onclick="event.stopPropagation();toggleMenu('insert')">Insert</button>
        <div class="menu-dropdown ${openMenu==='insert'?'open':''}">
          <div class="menu-entry" onclick="menuAction('insertdate')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Date &amp; Time
          </div>
        </div>
      </div>
      <!-- Format -->
      <div class="menu-item">
        <button class="menu-trigger ${openMenu==='format'?'open':''}" onclick="event.stopPropagation();toggleMenu('format')">Format</button>
        <div class="menu-dropdown ${openMenu==='format'?'open':''}">
          <div class="menu-entry" onclick="menuAction('wordwrap')">
            <span class="check-mark">${wordWrap?'✓':''}</span>
            Word Wrap
          </div>
          <div class="menu-entry" onclick="menuAction('font')">
            <span class="check-mark" style="font-weight:700;font-size:15px">A</span>
            Font
          </div>
        </div>
      </div>
      <!-- Tools -->
      <div class="menu-item">
        <button class="menu-trigger ${openMenu==='tools'?'open':''}" onclick="event.stopPropagation();toggleMenu('tools')">Tools</button>
        <div class="menu-dropdown ${openMenu==='tools'?'open':''}">
          <div class="menu-entry" onclick="menuAction('wordcount')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
            Word Count
          </div>
        </div>
      </div>
      <!-- View -->
      <div class="menu-item">
        <button class="menu-trigger ${openMenu==='view'?'open':''}" onclick="event.stopPropagation();toggleMenu('view')">View</button>
        <div class="menu-dropdown ${openMenu==='view'?'open':''}">
          <div class="menu-entry" onclick="menuAction('togglesidebar')">
            <span class="check-mark">${sidebarOpen?'✓':''}</span>
            Sidebar
          </div>
          <div class="menu-entry" onclick="menuAction('statusbar')">
            <span class="check-mark">✓</span>
            Status Bar
          </div>
        </div>
      </div>
      <!-- Help -->
      <div class="menu-item">
        <button class="menu-trigger ${openMenu==='help'?'open':''}" onclick="event.stopPropagation();toggleMenu('help')">Help</button>
        <div class="menu-dropdown ${openMenu==='help'?'open':''}">
          <div class="menu-entry" onclick="menuAction('about')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            About Notepad
          </div>
        </div>
      </div>

      <!-- Right-side color pickers -->
      <div class="toolbar-right">
        <div class="color-picker-wrapper">
          <button class="tb-btn" onclick="event.stopPropagation();toggleDropdown('textColor')" title="Text Color">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16"/><path d="M9.5 4h5l4 12h-2l-1-3h-7l-1 3H5.5L9.5 4z"/></svg>
            <div style="position:absolute;bottom:2px;left:6px;right:6px;height:3px;border-radius:2px;background:${active.textColor||'#1a1a1a'}"></div>
          </button>
          <div class="color-dropdown ${openDropdown==='textColor'?'open':''}" onclick="event.stopPropagation()">
            <label>Text Color</label>
            <div class="color-grid">${COLORS.map(c=>`<div class="color-dot ${(active.textColor||'#1a1a1a')===c?'active':''}" onclick="setColor('textColor','${c}')"><div class="color-dot-inner" style="background:${c}"></div></div>`).join('')}</div>
          </div>
        </div>
        <div class="color-picker-wrapper">
          <button class="tb-btn" onclick="event.stopPropagation();toggleDropdown('bgColor')" title="Background Color">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>
            <div style="position:absolute;bottom:2px;left:6px;right:6px;height:3px;border-radius:2px;background:${active.bgColor||'#ffffff'};border:1px solid rgba(0,0,0,.1)"></div>
          </button>
          <div class="color-dropdown ${openDropdown==='bgColor'?'open':''}" onclick="event.stopPropagation()">
            <label>Background</label>
            <div class="color-grid">${BG_COLORS.map(c=>`<div class="color-dot ${(active.bgColor||'#ffffff')===c?'active':''}" onclick="setColor('bgColor','${c}')"><div class="color-dot-inner" style="background:${c}"></div></div>`).join('')}</div>
          </div>
        </div>
      </div>
    </div>

    ${showFindBar?`
    <div class="find-bar">
      <input type="text" id="find-input" placeholder="Find..." />
      <input type="text" id="replace-input" placeholder="Replace..." />
      <button onclick="doFind()">Find</button>
      <button onclick="doReplace()">Replace</button>
      <button onclick="doReplaceAll()">All</button>
      <span class="find-close" onclick="showFindBar=false;render()">✕</span>
    </div>`:''}

    <div class="editor-wrapper" style="background:${active.bgColor||'#ffffff'}">
      <input class="editor-title" id="editor-title" type="text" placeholder="Untitled Note" value="${esc(active.title)}" style="color:${active.textColor||'#1a1a1a'};font-family:'${editorFont}'" />
      <hr class="editor-title-hr" />
      <textarea class="editor-content ${wordWrap?'':'no-wrap'}" id="editor-content" placeholder="Start writing..." style="color:${active.textColor||'#1a1a1a'};font-family:'${editorFont}'">${esc(active.content)}</textarea>
    </div>
    <div class="status-bar"><span>Words: ${wordCount(active.content)}</span></div>
  `;
}

function renderConfirm(){return`
  <div class="confirm-overlay" onclick="deleteTarget=null;render()">
    <div class="confirm-dialog" onclick="event.stopPropagation()">
      <h4>Delete this note?</h4><p>This action cannot be undone.</p>
      <div class="confirm-actions">
        <button class="btn btn-cancel" onclick="deleteTarget=null;render()">Cancel</button>
        <button class="btn btn-danger" onclick="deleteNote()">Delete</button>
      </div>
    </div>
  </div>`}

function renderFontPicker(){return`
  <div class="font-overlay" onclick="showFontPicker=false;render()">
    <div class="font-dialog" onclick="event.stopPropagation()">
      <h4>Choose Font</h4>
      ${FONTS.map(f=>`<div class="font-option ${editorFont===f?'active':''}" style="font-family:'${f}'" onclick="editorFont='${f}';showFontPicker=false;saveFields();render()">${f}</div>`).join('')}
      <div class="close-font"><button class="btn btn-cancel" onclick="showFontPicker=false;render()">Close</button></div>
    </div>
  </div>`}

// ─── Events ───
function bindEvents(){
  const t=document.getElementById('editor-title'),c=document.getElementById('editor-content');
  if(t&&c){
    let timer;
    const autoSave=()=>{clearTimeout(timer);timer=setTimeout(()=>{
      const note=getActive();if(!note)return;
      note.title=t.value;note.content=c.value;note.updatedAt=Date.now();save();
      const ai=document.querySelector('.note-item.active');
      if(ai){
        ai.querySelector('.note-item-title').textContent=note.title||'Untitled Note';
        ai.querySelector('.note-item-preview').textContent=note.content||'Blank';
        ai.querySelector('.note-item-date').textContent=fmtDate(note.updatedAt);
      }
      const sb=document.querySelector('.status-bar span');
      if(sb)sb.textContent='Words: '+wordCount(note.content);
    },300)};
    t.addEventListener('input',autoSave);
    c.addEventListener('input',autoSave);
    c.addEventListener('focus',()=>{if(undoStack.length===0)pushUndo()});
    c.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')pushUndo()});
  }
  const s=document.getElementById('search-input');
  if(s)s.addEventListener('input',e=>{searchQuery=e.target.value;render();const el=document.getElementById('search-input');if(el){el.focus();el.setSelectionRange(searchQuery.length,searchQuery.length)}});
}

// ─── Actions ───
function createNote(){saveFields();const note={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:'',content:'',textColor:'#1a1a1a',bgColor:'#ffffff',createdAt:Date.now(),updatedAt:Date.now()};notes.unshift(note);activeNoteId=note.id;save();render();document.getElementById('editor-title')?.focus()}
function selectNote(id){saveFields();activeNoteId=id;openMenu=null;openDropdown=null;render();if(window.innerWidth<=700)sidebarOpen=false}
function saveFields(){const note=getActive();if(!note)return;const t=document.getElementById('editor-title'),c=document.getElementById('editor-content');if(t)note.title=t.value;if(c)note.content=c.value;note.updatedAt=Date.now();save()}
function confirmDelete(id){deleteTarget=id;render()}
function deleteNote(){notes=notes.filter(n=>n.id!==deleteTarget);if(activeNoteId===deleteTarget)activeNoteId=notes.length>0?notes[0].id:null;deleteTarget=null;save();render()}
function toggleSidebar(){sidebarOpen=!sidebarOpen;render()}
function toggleMenu(m){openMenu=openMenu===m?null:m;openDropdown=null;render()}
function toggleDropdown(w){openDropdown=openDropdown===w?null:w;openMenu=null;render()}
function setColor(prop,color){const note=getActive();if(!note)return;const t=document.getElementById('editor-title'),c=document.getElementById('editor-content');if(t)note.title=t.value;if(c)note.content=c.value;note[prop]=color;note.updatedAt=Date.now();save();render()}

// ─── Menu Actions ───
function menuAction(action){
  openMenu=null;
  const c=document.getElementById('editor-content');
  const t=document.getElementById('editor-title');
  switch(action){
    case'new':createNote();return;
    case'open':document.getElementById('file-open-input')?.click()||createFileInput();return;
    case'save':saveAsFile(false);break;
    case'saveas':saveAsFile(true);break;
    case'print':window.print();break;
    case'undo':
      if(undoStack.length>0&&c){
        redoStack.push({title:t?.value||'',content:c.value});
        const state=undoStack.pop();
        if(t)t.value=state.title;c.value=state.content;
        const note=getActive();if(note){note.title=state.title;note.content=state.content;note.updatedAt=Date.now();save();}
      }
      break;
    case'redo':
      if(redoStack.length>0&&c){
        undoStack.push({title:t?.value||'',content:c.value});
        const state=redoStack.pop();
        if(t)t.value=state.title;c.value=state.content;
        const note=getActive();if(note){note.title=state.title;note.content=state.content;note.updatedAt=Date.now();save();}
      }
      break;
    case'cut':document.execCommand('cut');break;
    case'copy':document.execCommand('copy');break;
    case'delete':if(c){const s=c.selectionStart,e=c.selectionEnd;if(s!==e){c.setRangeText('',s,e,'end');c.dispatchEvent(new Event('input'))}}break;
    case'selectall':if(c){c.focus();c.select()}break;
    case'find':showFindBar=!showFindBar;render();if(showFindBar)document.getElementById('find-input')?.focus();return;
    case'insertdate':if(c){const d=new Date().toLocaleString();const s=c.selectionStart;c.setRangeText(d,s,c.selectionEnd,'end');c.dispatchEvent(new Event('input'))}break;
    case'wordwrap':wordWrap=!wordWrap;break;
    case'font':showFontPicker=true;break;
    case'wordcount':alert('Words: '+wordCount(c?.value||''));break;
    case'togglesidebar':sidebarOpen=!sidebarOpen;break;
    case'statusbar':break;
    case'about':alert('Online Notepad v1.0\\nA simple, clean notepad with local storage.');break;
  }
  render();
}

// File operations
function saveAsFile(forceDialog){
  const note=getActive();if(!note)return;
  saveFields();
  const blob=new Blob([note.content],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(note.title||'Untitled Note')+'.txt';
  a.click();
  URL.revokeObjectURL(a.href);
}

function createFileInput(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.txt,.md,.text';inp.id='file-open-input';
  inp.style.display='none';
  inp.addEventListener('change',e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      createNote();
      const note=getActive();if(!note)return;
      note.title=file.name.replace(/\.[^.]+$/,'');
      note.content=ev.target.result;
      note.updatedAt=Date.now();save();render();
    };
    reader.readAsText(file);
    inp.remove();
  });
  document.body.appendChild(inp);
  inp.click();
}

// Find & Replace
function doFind(){
  const c=document.getElementById('editor-content'),fi=document.getElementById('find-input');
  if(!c||!fi||!fi.value)return;
  const idx=c.value.indexOf(fi.value,c.selectionEnd);
  if(idx!==-1){c.focus();c.setSelectionRange(idx,idx+fi.value.length)}
  else{const idx2=c.value.indexOf(fi.value);if(idx2!==-1){c.focus();c.setSelectionRange(idx2,idx2+fi.value.length)}else alert('Not found')}
}
function doReplace(){
  const c=document.getElementById('editor-content'),fi=document.getElementById('find-input'),ri=document.getElementById('replace-input');
  if(!c||!fi||!ri)return;
  const sel=c.value.substring(c.selectionStart,c.selectionEnd);
  if(sel===fi.value){pushUndo();c.setRangeText(ri.value,c.selectionStart,c.selectionEnd,'end');c.dispatchEvent(new Event('input'))}
  doFind();
}
function doReplaceAll(){
  const c=document.getElementById('editor-content'),fi=document.getElementById('find-input'),ri=document.getElementById('replace-input');
  if(!c||!fi?.value||!ri)return;
  pushUndo();c.value=c.value.split(fi.value).join(ri.value);c.dispatchEvent(new Event('input'));
}

// ─── Global ───
document.addEventListener('click',()=>{if(openMenu){openMenu=null;render()}if(openDropdown){openDropdown=null;render()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(deleteTarget!==null){deleteTarget=null;render()}else if(showFontPicker){showFontPicker=false;render()}else if(openMenu){openMenu=null;render()}else if(showFindBar){showFindBar=false;render()}}
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveFields();menuAction('save')}
  if((e.ctrlKey||e.metaKey)&&e.key==='h'){e.preventDefault();menuAction('find')}
});

if(notes.length===0)createNote();else render();
</script>
</body>
