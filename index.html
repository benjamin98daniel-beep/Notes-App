  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#f4f5f7;--surface:#fff;--sidebar-bg:#f9fafb;--topbar:#1e1e1e;
      --text:#1a1a1a;--text-muted:#6b7280;--text-light:#9ca3af;
      --accent:#3b82f6;--accent-hover:#2563eb;--border:#e5e7eb;--border-light:#f0f1f3;
      --hover:#f3f4f6;--active:#e8edf4;--danger:#ef4444;--sidebar-w:300px;
    }
    html,body{height:100%;font-family:'IBM Plex Sans',-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}

    .topbar{height:48px;background:var(--topbar);display:flex;align-items:center;padding:0 16px;gap:14px}
    .hamburger{background:none;border:none;color:#fff;cursor:pointer;padding:4px;display:flex;align-items:center;border-radius:4px}
    .hamburger:hover{background:rgba(255,255,255,.1)}
    .topbar-title{font-weight:600;color:#fff;text-transform:uppercase;font-size:13px;letter-spacing:1.2px}

    .layout{display:flex;height:calc(100vh - 48px)}

    /* Sidebar */
    .sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:margin-left .25s ease}
    .sidebar.collapsed{margin-left:calc(-1 * var(--sidebar-w))}
    .sidebar-top{padding:16px}
    .create-btn{width:100%;padding:10px 16px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
    .create-btn:hover{background:var(--accent-hover)}
    .search-box{padding:0 16px 12px}
    .search-wrapper{position:relative}
    .search-box input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;outline:none;background:var(--surface);color:var(--text);transition:border-color .15s}
    .search-box input:focus{border-color:var(--accent)}
    .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-light)}
    .sidebar-toolbar{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 8px;border-bottom:1px solid var(--border-light)}
    .sort-icon{color:var(--text-light);width:18px;height:18px}
    .more-btn{background:none;border:none;color:var(--text-light);cursor:pointer;padding:4px;border-radius:4px;display:flex;align-items:center}
    .more-btn:hover{background:var(--hover)}
    .notes-list{flex:1;overflow-y:auto}
    .notes-list::-webkit-scrollbar{width:4px}
    .notes-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
    .note-item{padding:14px 16px;cursor:pointer;border-left:3px solid transparent;transition:background .1s;position:relative}
    .note-item:hover{background:var(--hover)}
    .note-item.active{background:var(--active);border-left-color:var(--accent)}
    .note-item-title{font-size:14px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:28px}
    .note-item-preview{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .note-item-date{font-size:11px;color:var(--text-light);margin-top:4px}
    .delete-note-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:4px;border:none;background:transparent;color:var(--text-light);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:all .1s}
    .note-item:hover .delete-note-btn{opacity:1}
    .delete-note-btn:hover{background:#fee2e2;color:var(--danger)}

    /* Editor */
    .editor-area{flex:1;display:flex;flex-direction:column;min-width:0}

    /* Toolbar */
    .editor-toolbar{display:flex;align-items:center;gap:0;padding:0;background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:60}
    .menu-item{position:relative}
    .menu-trigger{font-size:13.5px;color:var(--text);padding:8px 14px;cursor:pointer;border:none;background:none;font-family:inherit;font-weight:500;transition:background .1s;display:block}
    .menu-trigger:hover,.menu-trigger.open{background:var(--hover)}
    .menu-dropdown{position:absolute;top:100%;left:0;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.12);min-width:210px;padding:4px 0;display:none;z-index:70}
    .menu-dropdown.open{display:block}
    .menu-entry{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;font-size:13.5px;color:var(--text);transition:background .08s;white-space:nowrap}
    .menu-entry:hover{background:var(--hover)}
    .menu-entry svg{width:16px;height:16px;flex-shrink:0;color:var(--text-muted)}
    .menu-entry .shortcut{margin-left:auto;font-size:11px;color:var(--text-light)}
    .menu-sep{height:1px;background:var(--border-light);margin:4px 0}
    .check-mark{width:16px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}

    /* Color buttons */
    .toolbar-right{margin-left:auto;display:flex;align-items:center;gap:2px;padding-right:8px}
    .tb-btn{width:34px;height:34px;border:none;background:none;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background .1s;position:relative}
    .tb-btn:hover{background:var(--hover)}
    .tb-btn svg{width:16px;height:16px}
    .color-picker-wrapper{position:relative}
    .color-dropdown{position:absolute;top:38px;right:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:70;display:none}
    .color-dropdown.open{display:block}
    .color-dropdown label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:8px}
    .color-grid{display:grid;grid-template-columns:repeat(6,28px);gap:5px}
    .color-dot{width:28px;height:28px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;transition:transform .1s}
    .color-dot:hover{transform:scale(1.15)}
    .color-dot.active{border-color:var(--accent)}
    .color-dot-inner{width:100%;height:100%;border-radius:50%;border:1px solid rgba(0,0,0,.1)}

    /* Editor body */
    .editor-wrapper{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .editor-title-input{border:none;outline:none;font-family:'IBM Plex Sans',sans-serif;font-size:24px;font-weight:600;padding:24px 32px 8px;background:transparent;width:100%;color:var(--text)}
    .editor-title-input::placeholder{color:var(--text-light)}
    .editor-title-hr{margin:0 32px;border:none;border-top:1px solid var(--border-light)}

    .editor-content{
      flex:1;outline:none;font-family:'IBM Plex Sans',sans-serif;font-size:15px;line-height:1.75;
      padding:16px 32px 32px;background:transparent;overflow-y:auto;color:var(--text);
      word-wrap:break-word;overflow-wrap:break-word;
    }
    .editor-content:empty::before{content:attr(data-placeholder);color:var(--text-light);pointer-events:none}
    .editor-content.no-wrap{white-space:nowrap;overflow-x:auto}
    .editor-content::-webkit-scrollbar{width:6px}
    .editor-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

    .status-bar{height:28px;background:var(--sidebar-bg);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;padding:0 16px;font-size:11px;color:var(--text-light);gap:16px}
    .empty-editor{flex:1;display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--text-light);font-size:14px}

    /* Find bar */
    .find-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:#fefce8;border-bottom:1px solid #fde68a;flex-wrap:wrap}
    .find-bar input{padding:6px 10px;border:1px solid var(--border);border-radius:4px;font-family:inherit;font-size:13px;outline:none;width:160px}
    .find-bar input:focus{border-color:var(--accent)}
    .find-bar button{padding:5px 12px;border:1px solid var(--border);border-radius:4px;background:var(--surface);font-family:inherit;font-size:12px;cursor:pointer;font-weight:500}
    .find-bar button:hover{background:var(--hover)}
    .find-bar .find-close{border:none;background:none;cursor:pointer;color:var(--text-muted);font-size:18px;padding:4px 6px;border-radius:4px}
    .find-bar .find-close:hover{background:var(--hover)}

    /* Font picker */
    .font-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
    .font-dialog{background:var(--surface);border-radius:10px;padding:24px;max-width:340px;width:100%;box-shadow:0 16px 48px rgba(0,0,0,.15)}
    .font-dialog h4{font-size:16px;margin-bottom:14px}
    .font-option{padding:10px 14px;cursor:pointer;border-radius:6px;font-size:14px;transition:background .1s;margin-bottom:2px}
    .font-option:hover{background:var(--hover)}
    .font-option.active{background:var(--active);font-weight:600}
    .close-font{margin-top:12px;text-align:right}

    /* Confirm */
    .confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
    .confirm-dialog{background:var(--surface);border-radius:10px;padding:24px 28px;max-width:360px;width:100%;box-shadow:0 16px 48px rgba(0,0,0,.15)}
    .confirm-dialog h4{font-size:16px;margin-bottom:6px}
    .confirm-dialog p{font-size:13px;color:var(--text-muted);margin-bottom:18px}
    .confirm-actions{display:flex;gap:8px;justify-content:flex-end}
    .btn{padding:8px 18px;border-radius:6px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
    .btn-cancel{background:var(--hover);color:var(--text)}
    .btn-cancel:hover{background:var(--border)}
    .btn-danger{background:var(--danger);color:#fff}
    .btn-danger:hover{background:#dc2626}

    @media print{.topbar,.sidebar,.editor-toolbar,.status-bar,.find-bar{display:none!important}.layout{display:block}.editor-wrapper{box-shadow:none}}

    @media(max-width:700px){
      :root{--sidebar-w:260px}
      .sidebar{position:fixed;top:48px;left:0;bottom:0;z-index:50;box-shadow:4px 0 20px rgba(0,0,0,.1)}
      .sidebar.collapsed{margin-left:calc(-1 * var(--sidebar-w));box-shadow:none}
      .mobile-overlay{position:fixed;inset:0;top:48px;background:rgba(0,0,0,.3);z-index:40}
      .editor-title-input{padding:20px 16px 8px;font-size:20px}
      .editor-title-hr{margin:0 16px}
      .editor-content{padding:12px 16px 24px;font-size:14px}
    }
  </style>
</head>
<body>

<!-- Visually hidden H1 for SEO — crawlers see it, users see the app UI -->
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0">
  Simple Online Notes App – Free Colorful Notes Editor
</h1>

<div id="app"></div>

<!-- Fallback content for search engines / no-JS browsers -->
<noscript>
  <div style="max-width:700px;margin:40px auto;padding:0 20px;font-family:sans-serif;line-height:1.6">
    <h2>Simple Notes App – Free Online Colorful Notes Editor</h2>
    <p>Welcome to Simple Notes App, a free, lightweight online notepad that lets you write, save, and color-customize your notes right in the browser. No sign-up or download required.</p>
    <h3>Features</h3>
    <p>Create and manage multiple notes, change text and highlight colors, use bold, italic, underline, and strikethrough formatting, find and replace text, choose from multiple fonts, download notes as text files, and enjoy a responsive design that works on desktop and mobile.</p>
    <p>Built by Benjamin Daniel using HTML, CSS, and JavaScript. Please enable JavaScript to use this app.</p>
  </div>
</noscript>

<script>
// ─── State ───
let notes = JSON.parse(localStorage.getItem('np_notes') || '[]');
let activeNoteId = notes.length > 0 ? notes[0].id : null;
let searchQuery = '';
let sidebarOpen = true;
let deleteTarget = null;
let openDropdown = null;
let openMenu = null;
let wordWrap = true;
let showFindBar = false;
let showFontPicker = false;
let editorFont = 'IBM Plex Sans';
let currentTextColor = '#1a1a1a';
let currentHighlight = 'transparent';

const FONTS = ['IBM Plex Sans','Georgia','Courier New','Verdana','Times New Roman','Trebuchet MS'];
const TEXT_COLORS = [
  '#1a1a1a','#374151','#6b7280','#dc2626','#ea580c','#d97706',
  '#16a34a','#0891b2','#2563eb','#7c3aed','#db2777','#ffffff'
];
const HIGHLIGHT_COLORS = [
  'transparent','#fef08a','#bbf7d0','#bfdbfe','#fbcfe8',
  '#ddd6fe','#fed7aa','#99f6e4','#e5e7eb','#fef3c7','#c7d2fe','#374151'
];

function save() { localStorage.setItem('np_notes', JSON.stringify(notes)); }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function getActive() { return notes.find(n => n.id === activeNoteId) || null; }
function fmtDate(ts) {
  const d=new Date(ts),now=new Date(),diff=now-d;
  if(diff<60000)return'just now';if(diff<3600000)return Math.floor(diff/60000)+'m ago';
  if(diff<86400000)return Math.floor(diff/3600000)+'h ago';
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function getTextContent(html) {
  const div = document.createElement('div');
  div.innerHTML = html || '';
  return div.textContent || '';
}
function wordCount(html) { const t = getTextContent(html).trim(); return t ? t.split(/\s+/).length : 0; }

// ─── Selection helpers ───
let savedRange = null;
function saveSelection() {
  const sel = window.getSelection();
  if (sel.rangeCount > 0) savedRange = sel.getRangeAt(0).cloneRange();
}
function restoreSelection() {
  if (!savedRange) return;
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(savedRange);
}

// ─── Render ───
function render() {
  const filtered = notes.filter(n => {
    const plain = getTextContent(n.content).toLowerCase();
    return (n.title||'').toLowerCase().includes(searchQuery.toLowerCase()) || plain.includes(searchQuery.toLowerCase());
  });
  const active = getActive();
  const isMobile = window.innerWidth <= 700;

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <button class="hamburger" onclick="toggleSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="topbar-title">Online Notepad</span>
    </div>
    <div class="layout">
      ${isMobile && sidebarOpen ? '<div class="mobile-overlay" onclick="toggleSidebar()"></div>' : ''}
      <aside class="sidebar ${sidebarOpen?'':'collapsed'}">
        <div class="sidebar-top"><button class="create-btn" onclick="createNote()">+ Create new</button></div>
        <div class="search-box"><div class="search-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="search-input" placeholder="Search..." value="${esc(searchQuery)}" />
        </div></div>
        <div class="sidebar-toolbar">
          <svg class="sort-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h7M4 12h10M4 18h16"/></svg>
          <button class="more-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>
        </div>
        <div class="notes-list">
          ${filtered.length===0?`<div style="padding:32px 16px;text-align:center;color:var(--text-light);font-size:13px">${notes.length===0?'No notes yet':'No results'}</div>`:
          filtered.map(n=>`
            <div class="note-item ${n.id===activeNoteId?'active':''}" onclick="selectNote('${n.id}')">
              <div class="note-item-title">${esc(n.title||'Untitled Note')}</div>
              <div class="note-item-preview">${esc(getTextContent(n.content)||'Blank')}</div>
              <div class="note-item-date">${fmtDate(n.updatedAt)}</div>
              <button class="delete-note-btn" onclick="event.stopPropagation();confirmDelete('${n.id}')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
              </button>
            </div>
          `).join('')}
        </div>
      </aside>
      <main class="editor-area">
        ${active ? renderEditor(active) : '<div class="empty-editor">Select a note or create a new one</div>'}
      </main>
    </div>
    ${deleteTarget!==null?renderConfirm():''}
    ${showFontPicker?renderFontPicker():''}
  `;
  bindEvents();
}

function renderEditor(a) {
  return `
    <div class="editor-toolbar">
      ${renderMenu('file','File',`
        <div class="menu-entry" onclick="menuAction('new')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>New<span class="shortcut">Ctrl+N</span></div>
        <div class="menu-entry" onclick="menuAction('open')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>Open<span class="shortcut">Ctrl+O</span></div>
        <div class="menu-sep"></div>
        <div class="menu-entry" onclick="menuAction('save')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>Save<span class="shortcut">Ctrl+S</span></div>
        <div class="menu-entry" onclick="menuAction('saveas')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M5 12l7 7 7-7"/><path d="M19 21H5"/></svg>Save As</div>
        <div class="menu-sep"></div>
        <div class="menu-entry" onclick="menuAction('print')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Print<span class="shortcut">Ctrl+P</span></div>
      `)}
      ${renderMenu('edit','Edit',`
        <div class="menu-entry" onclick="menuAction('undo')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1014.85-3.36L3.51 4"/></svg>Undo<span class="shortcut">Ctrl+Z</span></div>
        <div class="menu-entry" onclick="menuAction('redo')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-14.85-3.36L23 4"/></svg>Redo<span class="shortcut">Ctrl+Y</span></div>
        <div class="menu-sep"></div>
        <div class="menu-entry" onclick="menuAction('cut')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>Cut<span class="shortcut">Ctrl+X</span></div>
        <div class="menu-entry" onclick="menuAction('copy')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copy<span class="shortcut">Ctrl+C</span></div>
        <div class="menu-entry" onclick="menuAction('delete')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Delete</div>
        <div class="menu-sep"></div>
        <div class="menu-entry" onclick="menuAction('selectall')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M3 9h18"/></svg>Select All<span class="shortcut">Ctrl+A</span></div>
        <div class="menu-sep"></div>
        <div class="menu-entry" onclick="menuAction('find')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Find &amp; Replace<span class="shortcut">Ctrl+H</span></div>
      `)}
      ${renderMenu('insert','Insert',`
        <div class="menu-entry" onclick="menuAction('insertdate')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Date &amp; Time</div>
      `)}
      ${renderMenu('format','Format',`
        <div class="menu-entry" onclick="menuAction('wordwrap')"><span class="check-mark">${wordWrap?'✓':''}</span>Word Wrap</div>
        <div class="menu-entry" onclick="menuAction('font')"><span class="check-mark" style="font-weight:700;font-size:15px">A</span>Font</div>
        <div class="menu-sep"></div>
        <div class="menu-entry" onclick="menuAction('bold')"><span class="check-mark" style="font-weight:700">B</span>Bold<span class="shortcut">Ctrl+B</span></div>
        <div class="menu-entry" onclick="menuAction('italic')"><span class="check-mark" style="font-style:italic">I</span>Italic<span class="shortcut">Ctrl+I</span></div>
        <div class="menu-entry" onclick="menuAction('underline')"><span class="check-mark" style="text-decoration:underline">U</span>Underline<span class="shortcut">Ctrl+U</span></div>
        <div class="menu-entry" onclick="menuAction('strikethrough')"><span class="check-mark" style="text-decoration:line-through">S</span>Strikethrough</div>
      `)}
      ${renderMenu('tools','Tools',`
        <div class="menu-entry" onclick="menuAction('wordcount')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>Word Count</div>
      `)}
      ${renderMenu('view','View',`
        <div class="menu-entry" onclick="menuAction('togglesidebar')"><span class="check-mark">${sidebarOpen?'✓':''}</span>Sidebar</div>
      `)}
      ${renderMenu('help','Help',`
        <div class="menu-entry" onclick="menuAction('about')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>About</div>
      `)}

      <div class="toolbar-right">
        <!-- Text Color -->
        <div class="color-picker-wrapper">
          <button class="tb-btn" onmousedown="event.preventDefault();saveSelection()" onclick="event.stopPropagation();toggleDropdown('textColor')" title="Text Color — select text first">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16"/><path d="M9.5 4h5l4 12h-2l-1-3h-7l-1 3H5.5L9.5 4z"/></svg>
            <div style="position:absolute;bottom:1px;left:6px;right:6px;height:3px;border-radius:2px;background:${currentTextColor}"></div>
          </button>
          <div class="color-dropdown ${openDropdown==='textColor'?'open':''}" onclick="event.stopPropagation()">
            <label>Text Color</label>
            <div class="color-grid">${TEXT_COLORS.map(c=>`<div class="color-dot ${currentTextColor===c?'active':''}" onmousedown="event.preventDefault()" onclick="applyTextColor('${c}')"><div class="color-dot-inner" style="background:${c}"></div></div>`).join('')}</div>
          </div>
        </div>
        <!-- Highlight Color -->
        <div class="color-picker-wrapper">
          <button class="tb-btn" onmousedown="event.preventDefault();saveSelection()" onclick="event.stopPropagation();toggleDropdown('highlight')" title="Highlight — select text first">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            <div style="position:absolute;bottom:1px;left:6px;right:6px;height:3px;border-radius:2px;background:${currentHighlight==='transparent'?'#e5e7eb':currentHighlight}"></div>
          </button>
          <div class="color-dropdown ${openDropdown==='highlight'?'open':''}" onclick="event.stopPropagation()">
            <label>Highlight</label>
            <div class="color-grid">${HIGHLIGHT_COLORS.map(c=>{
              const bg = c==='transparent'?'#ffffff':c;
              const isNone = c==='transparent';
              return `<div class="color-dot ${currentHighlight===c?'active':''}" onmousedown="event.preventDefault()" onclick="applyHighlight('${c}')"><div class="color-dot-inner" style="background:${bg}${isNone?';position:relative':''}"></div></div>`;
            }).join('')}</div>
          </div>
        </div>
      </div>
    </div>

    ${showFindBar?`
    <div class="find-bar">
      <input type="text" id="find-input" placeholder="Find..." />
      <input type="text" id="replace-input" placeholder="Replace..." />
      <button onclick="doFind()">Find</button>
      <button onclick="doReplace()">Replace</button>
      <button onclick="doReplaceAll()">All</button>
      <span class="find-close" onclick="showFindBar=false;render()">✕</span>
    </div>`:''}

    <div class="editor-wrapper" style="background:${a.bgColor||'#ffffff'}">
      <input class="editor-title-input" id="editor-title" type="text" placeholder="Untitled Note" value="${esc(a.title)}" style="font-family:'${editorFont}'" />
      <hr class="editor-title-hr" />
      <div class="editor-content ${wordWrap?'':'no-wrap'}" id="editor-content" contenteditable="true" data-placeholder="Start writing..." style="font-family:'${editorFont}'">${a.content||''}</div>
    </div>
    <div class="status-bar"><span>Words: ${wordCount(a.content)}</span></div>
  `;
}

function renderMenu(id, label, items) {
  return `<div class="menu-item">
    <button class="menu-trigger ${openMenu===id?'open':''}" onmousedown="event.preventDefault()" onclick="event.stopPropagation();toggleMenu('${id}')">${label}</button>
    <div class="menu-dropdown ${openMenu===id?'open':''}">${items}</div>
  </div>`;
}

function renderConfirm(){return`
  <div class="confirm-overlay" onclick="deleteTarget=null;render()">
    <div class="confirm-dialog" onclick="event.stopPropagation()">
      <h4>Delete this note?</h4><p>This action cannot be undone.</p>
      <div class="confirm-actions">
        <button class="btn btn-cancel" onclick="deleteTarget=null;render()">Cancel</button>
        <button class="btn btn-danger" onclick="deleteNote()">Delete</button>
      </div>
    </div>
  </div>`}

function renderFontPicker(){return`
  <div class="font-overlay" onclick="showFontPicker=false;render()">
    <div class="font-dialog" onclick="event.stopPropagation()">
      <h4>Choose Font</h4>
      ${FONTS.map(f=>`<div class="font-option ${editorFont===f?'active':''}" style="font-family:'${f}'" onclick="editorFont='${f}';showFontPicker=false;saveFields();render()">${f}</div>`).join('')}
      <div class="close-font"><button class="btn btn-cancel" onclick="showFontPicker=false;render()">Close</button></div>
    </div>
  </div>`}

// ─── Color application (selection-based) ───
function applyTextColor(color) {
  currentTextColor = color;
  restoreSelection();
  const sel = window.getSelection();
  if (sel.rangeCount > 0 && !sel.isCollapsed) {
    document.execCommand('styleWithCSS', false, true);
    document.execCommand('foreColor', false, color);
  }
  openDropdown = null;
  autoSaveContent();
  // Don't full re-render, just update the indicator
  document.querySelectorAll('.color-dropdown.open').forEach(d => d.classList.remove('open'));
}

function applyHighlight(color) {
  currentHighlight = color;
  restoreSelection();
  const sel = window.getSelection();
  if (sel.rangeCount > 0 && !sel.isCollapsed) {
    document.execCommand('styleWithCSS', false, true);
    if (color === 'transparent') {
      document.execCommand('hiliteColor', false, 'transparent');
    } else {
      document.execCommand('hiliteColor', false, color);
    }
  }
  openDropdown = null;
  autoSaveContent();
  document.querySelectorAll('.color-dropdown.open').forEach(d => d.classList.remove('open'));
}

function autoSaveContent() {
  const note = getActive(); if (!note) return;
  const t = document.getElementById('editor-title');
  const c = document.getElementById('editor-content');
  if (t) note.title = t.value;
  if (c) note.content = c.innerHTML;
  note.updatedAt = Date.now();
  save();
  // Update sidebar
  const ai = document.querySelector('.note-item.active');
  if (ai) {
    ai.querySelector('.note-item-title').textContent = note.title || 'Untitled Note';
    ai.querySelector('.note-item-preview').textContent = getTextContent(note.content) || 'Blank';
    ai.querySelector('.note-item-date').textContent = fmtDate(note.updatedAt);
  }
  const sb = document.querySelector('.status-bar span');
  if (sb) sb.textContent = 'Words: ' + wordCount(note.content);
}

// ─── Events ───
function bindEvents() {
  const t = document.getElementById('editor-title');
  const c = document.getElementById('editor-content');
  if (t && c) {
    let timer;
    const debounceSave = () => { clearTimeout(timer); timer = setTimeout(autoSaveContent, 400); };
    t.addEventListener('input', debounceSave);
    c.addEventListener('input', debounceSave);
    // Track selection for color apply
    c.addEventListener('mouseup', saveSelection);
    c.addEventListener('keyup', saveSelection);
  }
  const s = document.getElementById('search-input');
  if (s) s.addEventListener('input', e => {
    searchQuery = e.target.value;
    render();
    const el = document.getElementById('search-input');
    if (el) { el.focus(); el.setSelectionRange(searchQuery.length, searchQuery.length); }
  });
}

// ─── Core Actions ───
function createNote() {
  saveFields();
  const note = { id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), title:'', content:'', bgColor:'#ffffff', createdAt:Date.now(), updatedAt:Date.now() };
  notes.unshift(note); activeNoteId = note.id; save(); render();
  document.getElementById('editor-title')?.focus();
}
function selectNote(id) { saveFields(); activeNoteId = id; openMenu = null; openDropdown = null; render(); if (window.innerWidth <= 700) sidebarOpen = false; }
function saveFields() {
  const note = getActive(); if (!note) return;
  const t = document.getElementById('editor-title'), c = document.getElementById('editor-content');
  if (t) note.title = t.value;
  if (c) note.content = c.innerHTML;
  note.updatedAt = Date.now(); save();
}
function confirmDelete(id) { deleteTarget = id; render(); }
function deleteNote() {
  notes = notes.filter(n => n.id !== deleteTarget);
  if (activeNoteId === deleteTarget) activeNoteId = notes.length > 0 ? notes[0].id : null;
  deleteTarget = null; save(); render();
}
function toggleSidebar() { sidebarOpen = !sidebarOpen; render(); }
function toggleMenu(m) {
  saveSelection();
  openMenu = openMenu === m ? null : m;
  openDropdown = null;
  // Lightweight toggle
  document.querySelectorAll('.menu-dropdown').forEach(d => d.classList.remove('open'));
  document.querySelectorAll('.menu-trigger').forEach(b => b.classList.remove('open'));
  if (openMenu) {
    const items = document.querySelectorAll('.menu-item');
    items.forEach(item => {
      const btn = item.querySelector('.menu-trigger');
      if (btn && btn.textContent.trim().toLowerCase() === openMenu) {
        btn.classList.add('open');
        item.querySelector('.menu-dropdown')?.classList.add('open');
      }
    });
  }
}
function toggleDropdown(w) {
  openDropdown = openDropdown === w ? null : w;
  openMenu = null;
  document.querySelectorAll('.menu-dropdown').forEach(d => d.classList.remove('open'));
  document.querySelectorAll('.menu-trigger').forEach(b => b.classList.remove('open'));
  document.querySelectorAll('.color-dropdown').forEach(d => d.classList.remove('open'));
  if (openDropdown) {
    const wrappers = document.querySelectorAll('.color-picker-wrapper');
    const idx = openDropdown === 'textColor' ? 0 : 1;
    wrappers[idx]?.querySelector('.color-dropdown')?.classList.add('open');
  }
}

// ─── Menu Actions ───
function menuAction(action) {
  openMenu = null;
  document.querySelectorAll('.menu-dropdown').forEach(d => d.classList.remove('open'));
  document.querySelectorAll('.menu-trigger').forEach(b => b.classList.remove('open'));
  const c = document.getElementById('editor-content');

  switch(action) {
    case 'new': createNote(); return;
    case 'open': openFile(); return;
    case 'save': downloadFile(false); break;
    case 'saveas': downloadFile(true); break;
    case 'print': window.print(); break;
    case 'undo': restoreSelection(); document.execCommand('undo'); break;
    case 'redo': restoreSelection(); document.execCommand('redo'); break;
    case 'cut': restoreSelection(); document.execCommand('cut'); break;
    case 'copy': restoreSelection(); document.execCommand('copy'); break;
    case 'delete':
      restoreSelection();
      const sel = window.getSelection();
      if (sel.rangeCount > 0 && !sel.isCollapsed) sel.deleteFromDocument();
      break;
    case 'selectall':
      if (c) { c.focus(); document.execCommand('selectAll'); }
      break;
    case 'find': showFindBar = !showFindBar; render(); if (showFindBar) document.getElementById('find-input')?.focus(); return;
    case 'insertdate':
      restoreSelection();
      document.execCommand('insertText', false, new Date().toLocaleString());
      break;
    case 'wordwrap': wordWrap = !wordWrap; saveFields(); render(); return;
    case 'font': showFontPicker = true; render(); return;
    case 'bold': restoreSelection(); document.execCommand('bold'); break;
    case 'italic': restoreSelection(); document.execCommand('italic'); break;
    case 'underline': restoreSelection(); document.execCommand('underline'); break;
    case 'strikethrough': restoreSelection(); document.execCommand('strikeThrough'); break;
    case 'wordcount': alert('Words: ' + wordCount(c?.innerHTML || '')); break;
    case 'togglesidebar': sidebarOpen = !sidebarOpen; render(); return;
    case 'about': alert('Online Notepad v1.0\nA clean notepad with rich text editing.'); break;
  }
  autoSaveContent();
}

function downloadFile() {
  const note = getActive(); if (!note) return;
  saveFields();
  const text = getTextContent(note.content);
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (note.title || 'Untitled Note') + '.txt';
  a.click(); URL.revokeObjectURL(a.href);
}

function openFile() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.txt,.md,.text,.html';
  inp.addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      createNote();
      const note = getActive(); if (!note) return;
      note.title = file.name.replace(/\.[^.]+$/, '');
      note.content = ev.target.result.replace(/\n/g, '<br>');
      note.updatedAt = Date.now(); save(); render();
    };
    reader.readAsText(file);
  });
  inp.click();
}

// ─── Find & Replace ───
function doFind() {
  const c = document.getElementById('editor-content'), fi = document.getElementById('find-input');
  if (!c || !fi?.value) return;
  if (window.find) {
    c.focus();
    window.find(fi.value, false, false, true);
  }
}
function doReplace() {
  const c = document.getElementById('editor-content'), fi = document.getElementById('find-input'), ri = document.getElementById('replace-input');
  if (!c || !fi?.value || !ri) return;
  const sel = window.getSelection();
  if (sel.toString() === fi.value) {
    document.execCommand('insertText', false, ri.value);
    autoSaveContent();
  }
  doFind();
}
function doReplaceAll() {
  const c = document.getElementById('editor-content'), fi = document.getElementById('find-input'), ri = document.getElementById('replace-input');
  if (!c || !fi?.value || !ri) return;
  c.innerHTML = c.innerHTML.split(fi.value).join(esc(ri.value));
  autoSaveContent();
}

// ─── Global Listeners ───
document.addEventListener('click', () => {
  if (openMenu) { openMenu = null; document.querySelectorAll('.menu-dropdown').forEach(d=>d.classList.remove('open')); document.querySelectorAll('.menu-trigger').forEach(b=>b.classList.remove('open')); }
  if (openDropdown) { openDropdown = null; document.querySelectorAll('.color-dropdown').forEach(d=>d.classList.remove('open')); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (deleteTarget !== null) { deleteTarget = null; render(); }
    else if (showFontPicker) { showFontPicker = false; render(); }
    else if (openMenu) { openMenu = null; render(); }
    else if (showFindBar) { showFindBar = false; render(); }
  }
  if ((e.ctrlKey||e.metaKey) && e.key === 's') { e.preventDefault(); autoSaveContent(); }
  if ((e.ctrlKey||e.metaKey) && e.key === 'h') { e.preventDefault(); menuAction('find'); }
});

// ─── Init ───
if (notes.length === 0) createNote(); else render();
</script>
</body>
</html>
